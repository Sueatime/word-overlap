<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--muted:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--pur2:hsl(calc(var(--h) + 150) 70% 68%);--g:#22c55e;--line:hsl(var(--h) 20% 30%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 12px;color:var(--muted);font-size:18px}
button{font:inherit;font-weight:600;cursor:pointer}
#msg{min-height:26px;font-weight:600;margin:6px 0 10px}

.venn{position:relative;width:330px;height:210px;margin:14px auto 12px}
.circle{position:absolute;top:0;width:210px;height:210px;border-radius:50%;mix-blend-mode:screen}
.c1{left:0;background:hsl(var(--h) 70% 68% / .25);border:2px solid var(--pur)}
.c2{right:0;background:hsl(calc(var(--h) + 150) 70% 68% / .25);border:2px solid var(--pur2)}
.zone{position:absolute;top:0;height:210px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px;padding:0 6px}
.zl{left:0;width:120px}.zm{left:120px;width:90px}.zr{left:210px;width:120px}
.l{width:28px;height:28px;border-radius:8px;background:var(--panel);border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--ink)}
.zm .l{background:var(--ink);border-color:var(--ink);color:var(--bg)}

#rows{display:flex;flex-direction:column;gap:10px;align-items:center;margin:0 auto 16px}
.row{display:flex;gap:5px;padding:6px;border-radius:12px;border:2px solid var(--line);cursor:pointer}
.row.active{border-color:var(--pur)}
.t{--s:min(var(--cap,44px),calc((100vw - 72px - (var(--n) - 1) * 5px) / var(--n)));width:var(--s);height:var(--s);border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s) * .5);font-weight:700;text-transform:uppercase;color:var(--ink);background:var(--panel);padding:0;border-radius:8px}
.t.cur{border-color:var(--pur)}
.t.g{background:var(--g);border-color:var(--g);color:#052e16}
.t.give{border-style:dashed;color:var(--muted)}
.row.bad{animation:bad .35s}
.row.bad .t{border-color:#ef4444}
@keyframes bad{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.acts{display:flex;gap:12px;justify-content:center}
.acts button{padding:10px 18px;border-radius:8px;background:transparent;color:var(--ink);border:2px solid var(--muted)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hid{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;opacity:0;pointer-events:none;font-size:16px}

.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.win,.row.bad{animation:none}}
@media (min-width:800px){
:root{--cap:70px}
body{font-size:26px}
main{max-width:620px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.venn{zoom:1.3;margin:26px auto 22px}
.acts button{padding:14px 32px;font-size:22px}
.win{font-size:30px;max-width:620px}
}

WORDS.forEach(w=>D.add(w));
let ans=[],rows=[],found=[],active=0,over=false,won=false,gid=0;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const key=w=>w.split("").sort().join("");
const rnd=a=>a[Math.random()*a.length|0];

function split(a,b){
  const cb={};for(const c of b)cb[c]=(cb[c]||0)+1;
  const shared=[],left=[],right=[];
  for(const c of a){if(cb[c]>0){shared.push(c);cb[c]--}else left.push(c)}
  const cs={};for(const c of shared)cs[c]=(cs[c]||0)+1;
  for(const c of b){if(cs[c]>0)cs[c]--;else right.push(c)}
  return {shared:shuffle(shared),left:shuffle(left),right:shuffle(right)};
}
function pickPair(){
  for(let t=0;t<4000;t++){
    const a=rnd(WORDS),b=rnd(WORDS);
    if(a===b||key(a)===key(b))continue;
    const s=split(a,b),need=t<3000?2:1;
    if(s.shared.length>=need&&s.left.length>=1&&s.right.length>=1&&s.shared.length<=4)return [a,b,s];
  }
  return ["CLOUD","WORLD",split("CLOUD","WORLD")];
}
function tiles(el,arr){el.innerHTML=arr.map(c=>`<div class="l">${c}</div>`).join("")}

function newGame(){
  const [a,b,s]=pickPair();
  ans=Math.random()<.5?[a,b]:[b,a];found=[false,false];over=false;won=false;gid++;
  tiles($("zl"),s.left);tiles($("zm"),s.shared);tiles($("zr"),s.right);
  rows=ans.map(w=>({len:w.length,letters:Array(w.length).fill(""),solved:false,give:false,word:""}));
  active=rows.reduce((b,r,i)=>r.len>rows[b].len?i:b,0);
  document.documentElement.style.setProperty("--h",Math.floor(Math.random()*360));
  msg("");render();
}
function msg(t){const m=$("msg");m.textContent=t}

function render(){
  const box=$("rows");box.innerHTML="";
  rows.forEach((r,i)=>{
    const d=document.createElement("div");
    d.className="row"+(i===active&&!r.solved&&!over?" active":"");
    d.id="row"+i;
    const cur=r.letters.indexOf("");
    for(let k=0;k<r.len;k++){
      const t=document.createElement("div");
      t.className="t"+(r.solved?" g":r.give?" give":(i===active&&!over&&k===cur)?" cur":"");
      t.style.setProperty("--n",Math.max(...ans.map(w=>w.length)));
      t.textContent=r.letters[k]||"";
      d.appendChild(t);
    }
    d.onclick=()=>{if(!r.solved&&!over){active=i;render();inp.focus({preventScroll:true})}};
    box.appendChild(d);
  });
}
function press(c){
  if(over)return;
  const r=rows[active];if(!r||r.solved)return;
  const i=r.letters.indexOf("");if(i<0)return;
  r.letters[i]=c;render();
  check();
}
function back(){
  if(over)return;
  const r=rows[active];if(!r||r.solved)return;
  for(let i=r.len-1;i>=0;i--){if(r.letters[i]){r.letters[i]="";break}}
  render();
}
function check(){
  const r=rows[active],w=r.letters.join("");
  if(!w)return;
  const k=ans.findIndex((a,j)=>!found[j]&&a.length===w.length&&key(a)===key(w)&&(w===a||D.has(w)));
  if(k>=0){
    const tg=rows.find(x=>!x.solved&&x.len===w.length)||r;
    if(tg!==r)r.letters=Array(r.len).fill("");
    found[k]=true;tg.solved=true;tg.word=w;tg.letters=w.split("");
    if(found.every(Boolean)){over=true;won=true;render();popup();confetti();return}
    active=rows.findIndex(x=>!x.solved);
    msg("One down, one to go.");render();
  }else if(w.length>=r.len){
    $("row"+active).classList.add("bad");
    setTimeout(()=>{r.letters=Array(r.len).fill("");render()},380);
    msg(D.has(w)?"That word does not fit the circles.":"Not a word I know. Try again.");
  }
}
function giveUp(){
  if(over)return;
  over=true;
  const left=ans.map((a,j)=>j).filter(j=>!found[j]);
  rows.forEach(r=>{
    if(r.solved)return;
    const k=left.find(j=>ans[j].length===r.len);
    left.splice(left.indexOf(k),1);
    r.letters=ans[k].split("");r.give=true;
  });
  render();
  msg("You gave up. The words were "+ans.join(" and ")+".");
}
function popup(){
  let nm="";try{nm=(new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){}
  const d=document.createElement("div");d.className="win";
  d.textContent=(nm||"Player")+" won with '"+rows.map(r=>r.word).join("' and '")+"'";
  const m=$("msg");m.textContent="";m.appendChild(d);
  const id=gid;setTimeout(()=>{if(over&&won&&gid===id){newGame();inp.focus({preventScroll:true})}},6000);
}

/* typing: device keyboard through a hidden input */
const inp=$("inp");
inp.addEventListener("input",()=>{
  const v=inp.value;
  if(v.length===0)back();
  else for(const c of v.toUpperCase())if(/[A-Z]/.test(c))press(c);
  inp.value=" ";
});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Tab"){e.preventDefault();const n=rows.findIndex((r,i)=>i!==active&&!r.solved);if(n>=0){active=n;render()}return}
  if(document.activeElement===inp)return;
  if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase());
  else if(e.key==="Backspace")back();
});
$("newBtn").onclick=()=>{newGame();inp.focus({preventScroll:true})};
$("giveBtn").onclick=giveUp;

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();})();
}
newGame();
