<title>Word Overlap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12131c; --panel:#1b1d2a; --line:#2c2f42; --text:#f2f3f8; --muted:#8e92a8;
  --h:200;
  --acc:hsl(var(--h) 85% 62%);
  --acc2:hsl(calc(var(--h) + 150) 85% 64%);
  --accSoft:hsl(var(--h) 85% 62% / .28);
  --acc2Soft:hsl(calc(var(--h) + 150) 85% 64% / .28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 12px calc(16px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
h1{font-size:2.1rem;font-weight:800;letter-spacing:.5px;color:var(--acc)}
.desc{color:var(--muted);font-size:.95rem;margin-top:4px;text-align:center;max-width:340px}
.link{background:none;border:none;color:var(--acc);font:inherit;font-size:.9rem;font-weight:600;margin-top:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.venn{position:relative;width:330px;height:210px;margin:18px 0 10px;flex:none}
.circle{position:absolute;top:0;width:210px;height:210px;border-radius:50%;mix-blend-mode:screen}
.c1{left:0;background:var(--accSoft);border:2px solid var(--acc)}
.c2{right:0;background:var(--acc2Soft);border:2px solid var(--acc2)}
.zone{position:absolute;top:0;height:210px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px;padding:0 6px}
.zl{left:0;width:120px}
.zm{left:120px;width:90px}
.zr{left:210px;width:120px}
.l{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem}
.zm .l{background:var(--text);color:var(--bg)}

.msg{min-height:26px;margin:2px 0 8px;color:var(--muted);font-weight:500;text-align:center;font-size:1rem}
.msg.good{color:var(--acc);font-weight:700}

.rows{display:flex;flex-direction:column;gap:10px;align-items:center}
.row{display:flex;gap:6px;padding:6px;border-radius:12px;border:2px solid var(--line);cursor:pointer}
.row.active{border-color:var(--acc)}
.t{width:42px;height:48px;border-radius:10px;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:var(--muted)}
.t.has{color:var(--text);border-color:#4a4e68}
.t.lock{background:var(--accSoft);border-color:var(--acc);color:var(--text)}
.t.ok{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.t.give{color:var(--muted);border-style:dashed}
.row.bad{animation:bad .35s}
.row.bad .t{border-color:#ff5d6c}
@keyframes bad{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.btns{display:flex;gap:8px;margin:16px 0 14px}
.btn{font:inherit;font-weight:600;font-size:.95rem;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn:active{transform:scale(.97)}


#inp{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media(max-width:380px){.venn{transform:scale(.9);margin:8px 0 0}.t{width:38px;height:44px}}
@media (prefers-reduced-motion:reduce){.row.bad{animation:none}}
</style>
</head>
<body>
<h1>Word Overlap</h1>
<p class="desc">Two hidden words share some letters. Use the circles to work out both words.</p>

<div class="venn" id="venn" aria-label="Venn diagram of letters">
  <div class="circle c1"></div><div class="circle c2"></div>
  <div class="zone zl" id="zl"></div><div class="zone zm" id="zm"></div><div class="zone zr" id="zr"></div>
</div>

<div class="msg" id="msg"></div>
<div class="rows" id="rows"></div>

<div class="btns">
  <button class="btn main" id="newBtn">New game</button>
  <button class="btn" id="hintBtn">Hint</button>
  <button class="btn" id="giveBtn">Give up</button>
</div>

<input id="inp" type="text" value=" " autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Type your answer">

WORDS.forEach(w=>D.add(w));
let ans=[],rows=[],found=[],active=0,over=false;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const key=w=>w.split("").sort().join("");
const rnd=a=>a[Math.random()*a.length|0];

function split(a,b){
  const cb={};for(const c of b)cb[c]=(cb[c]||0)+1;
  const shared=[],left=[],right=[];
  for(const c of a){if(cb[c]>0){shared.push(c);cb[c]--}else left.push(c)}
  const cs={};for(const c of shared)cs[c]=(cs[c]||0)+1;
  for(const c of b){if(cs[c]>0)cs[c]--;else right.push(c)}
  return {shared:shuffle(shared),left:shuffle(left),right:shuffle(right)};
}
function pickPair(){
  for(let t=0;t<4000;t++){
    const a=rnd(WORDS),b=rnd(WORDS);
    if(a===b||key(a)===key(b))continue;
    const s=split(a,b);
    const need=t<3000?2:1;
    if(s.shared.length>=need&&s.left.length>=1&&s.right.length>=1&&s.shared.length<=4)return [a,b,s];
  }
  const a="CLOUD",b="WORLD";return [a,b,split(a,b)];
}
function tiles(el,arr){el.innerHTML=arr.map(c=>`<div class="l">${c}</div>`).join("")}

function newGame(){
  const [a,b,s]=pickPair();
  ans=Math.random()<.5?[a,b]:[b,a];found=[false,false];over=false;
  tiles($("zl"),s.left);tiles($("zm"),s.shared);tiles($("zr"),s.right);
  rows=ans.map(w=>({len:w.length,letters:Array(w.length).fill(""),lock:Array(w.length).fill(false),solved:false,hint:null,give:false}));
  active=0;
  document.documentElement.style.setProperty("--h",Math.floor(Math.random()*360));
  setMsg("");render();
}
function setMsg(t,good){const m=$("msg");m.textContent=t;m.className="msg"+(good?" good":"")}

function render(){
  $("rows").innerHTML="";
  rows.forEach((r,i)=>{
    const d=document.createElement("div");
    d.className="row"+(i===active&&!r.solved&&!over?" active":"");
    d.id="row"+i;
    for(let k=0;k<r.len;k++){
      const t=document.createElement("div");
      const ch=r.letters[k];
      t.className="t"+(r.solved?" ok":r.give?" give":r.lock[k]?" lock":ch?" has":"");
      t.textContent=ch||"_";
      d.appendChild(t);
    }
    d.onclick=()=>{if(!r.solved&&!over){active=i;render();inp.focus({preventScroll:true})}};
    $("rows").appendChild(d);
  });
}
function press(c){
  if(over)return;
  const r=rows[active];if(!r||r.solved)return;
  const i=r.letters.indexOf("");if(i<0)return;
  r.letters[i]=c;render();
  if(r.letters.indexOf("")<0)check();
}
function back(){
  if(over)return;
  const r=rows[active];if(!r||r.solved)return;
  for(let i=r.len-1;i>=0;i--){if(r.letters[i]&&!r.lock[i]){r.letters[i]="";break}}
  render();
}
function check(){
  const r=rows[active],w=r.letters.join("");
  const k=ans.findIndex((a,j)=>!found[j]&&key(a)===key(w)&&(w===a||D.has(w))&&(r.hint===null||r.hint===j));
  if(k>=0){
    found[k]=true;r.solved=true;
    if(found.every(Boolean)){over=true;render();setMsg("You found both words!",true);confetti();return}
    const n=rows.findIndex(x=>!x.solved);if(n>=0)active=n;
    setMsg("One down, one to go.");render();
  }else{
    const el=$("row"+active);el.classList.add("bad");
    setTimeout(()=>{r.letters=r.letters.map((c,i)=>r.lock[i]?c:"");render()},380);
    setMsg(D.has(w)?"That word does not fit the circles.":"Not a word I know. Try again.");
  }
}
function hint(){
  if(over)return;
  const cand=rows.map((r,i)=>i).filter(i=>!rows[i].solved&&rows[i].hint===null);
  if(!cand.length){setMsg("No more hints for this puzzle.");return}
  const i=rnd(cand),r=rows[i];
  const used=rows.map(x=>x.hint);
  const opts=ans.map((a,j)=>j).filter(j=>!found[j]&&!used.includes(j)&&ans[j].length===r.len);
  if(!opts.length){setMsg("No more hints for this puzzle.");return}
  const k=rnd(opts),w=ans[k];
  r.hint=k;r.letters=Array(r.len).fill("");r.lock=Array(r.len).fill(false);
  r.letters[0]=w[0];r.lock[0]=true;r.letters[r.len-1]=w[r.len-1];r.lock[r.len-1]=true;
  active=i;setMsg(`A word starts with ${w[0]} and ends with ${w[r.len-1]}.`);render();
}
function giveUp(){
  if(over)return;
  over=true;
  const left=ans.map((a,j)=>j).filter(j=>!found[j]);
  rows.forEach(r=>{
    if(r.solved)return;
    let k=r.hint!==null?r.hint:left.find(j=>ans[j].length===r.len);
    if(k===undefined)k=left[0];
    left.splice(left.indexOf(k),1);
    r.letters=ans[k].split("");r.give=true;
  });
  render();
  setMsg("The words were "+ans.join(" and ")+".");
}

/* typing: device keyboard through a hidden input */
const inp=$("inp");
inp.addEventListener("input",()=>{
  const v=inp.value;
  if(v.length===0)back();
  else for(const c of v.toUpperCase())if(/[A-Z]/.test(c))press(c);
  inp.value=" ";
});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Tab"){e.preventDefault();const n=rows.findIndex((r,i)=>i!==active&&!r.solved);if(n>=0){active=n;render()}return}
  if(document.activeElement===inp)return;
  if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase());
  else if(e.key==="Backspace")back();
});
$("newBtn").onclick=()=>{newGame();inp.focus({preventScroll:true})};$("hintBtn").onclick=()=>{hint();inp.focus({preventScroll:true})};$("giveBtn").onclick=giveUp;

function confetti(){
  const cv=$("fx"),x=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const h=+getComputedStyle(document.documentElement).getPropertyValue("--h");
  const rb=$("rows").getBoundingClientRect();const cx=rb.left+rb.width/2,cy=rb.top+rb.height/2;
  const P=Array.from({length:160},()=>{
    const a=Math.random()*Math.PI*2,v=4+Math.random()*10;
    return {x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,w:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:`hsl(${(h+Math.random()*220)%360} 85% 62%)`};
  });
  let f=0;
  (function go(){
    x.clearRect(0,0,cv.width,cv.height);
    const fade=Math.max(0,Math.min(1,(150-f)/40));
    P.forEach(p=>{p.vx*=.985;p.vy=p.vy*.985+.25;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.globalAlpha=fade;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6);x.restore()});
    if(++f<150)requestAnimationFrame(go);else x.clearRect(0,0,cv.width,cv.height);
  })();
}
newGame();
